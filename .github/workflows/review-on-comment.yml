name: review-quorum

# PR-comment-triggered multi-tool review.
# Comment "/review" on a pull request to run an aggregated Claude + Augment + Codex
# review (plus the Magento specialist on Magento repos) and post the
# confidence-ranked result back as a single PR comment.
#
# DEPLOY: copy this file into the TARGET repo's .github/workflows/ (e.g.
# magento-cia/magento2ce). It lives where the comments happen; the review
# tooling is pulled from magento-cia/review-quorum at run time.

on:
  issue_comment:
    types: [created]

# Least privilege: read the code, write the result comment.
permissions:
  contents: read
  pull-requests: write
  id-token: none

# One review per PR at a time; cancel the stale run when a new /review arrives.
concurrency:
  group: review-quorum-${{ github.event.repository.full_name }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Exact match — prevents accidental trigger on /reviewer, /reviews, /review-this, etc.
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorize commenter
        uses: actions/github-script@v7
        with:
          script: |
            const assoc = context.payload.comment.author_association;
            const allowed = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            if (!allowed.includes(assoc)) {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: context.payload.comment.id, content: 'confused',
              });
              core.setFailed(
                `@${context.payload.comment.user.login} (${assoc}) is not authorized to trigger /review.`
              );
            }

      - name: Acknowledge
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: context.payload.comment.id, content: 'eyes',
            });

      - name: Resolve PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            core.setOutput('number', String(pr.number));
            core.setOutput('url', pr.html_url);
            core.setOutput('head_sha', pr.head.sha);

      # Checkout the PR head so reviewers have the full codebase, not just the diff.
      # Assumption: non-fork PRs only — uses github.token which has contents:read on
      # this repo. External-fork PRs (head in a different org) will fail this step.
      - name: Checkout PR head for codebase context
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 1

      # Pinned to an immutable commit SHA.
      # REVIEW_QUORUM_TOKEN must be scoped to contents:read on magento-cia/review-quorum only.
      # To update: change the SHA below after reviewing the review-quorum diff.
      - name: Checkout review-quorum tooling
        uses: actions/checkout@v4
        with:
          repository: magento-cia/review-quorum
          path: .review-quorum
          ref: 6581611687eeb985e667d9f167a93d42e2ae41b3
          token: ${{ secrets.REVIEW_QUORUM_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install + authenticate AI CLIs
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUGMENT_SESSION_JSON: ${{ secrets.AUGMENT_SESSION_JSON }}
        run: |
          set -uo pipefail
          if [[ -n "${ANTHROPIC_AUTH_TOKEN:-}" ]]; then
            npm install -g @anthropic-ai/claude-code || echo "::warning::claude-code install failed"
          fi
          if [[ -n "${OPENAI_API_KEY:-}" ]]; then
            npm install -g @openai/codex || echo "::warning::codex install failed"
          fi
          if [[ -n "${AUGMENT_SESSION_JSON:-}" ]]; then
            npm install -g @augmentcode/auggie || echo "::warning::auggie install failed"
            mkdir -p "$HOME/.augment"
            if echo "$AUGMENT_SESSION_JSON" | jq empty 2>/dev/null; then
              printf '%s' "$AUGMENT_SESSION_JSON" > "$HOME/.augment/session.json"
            else
              echo "::warning::AUGMENT_SESSION_JSON is not valid JSON — Augment will be skipped"
            fi
          fi

      # Provision the devx-evolve code-review runtime so the sub-reviewer agents
      # (devx-pr-review-*, devx-consolidator-reviewer) are available to Claude.
      # Uses a read-only deploy key scoped to sadmane_adobe/devx-evolve.
      # DEVX_EVOLVE_REF is pinned alongside the review-quorum ref above.
      - name: Provision devx-evolve code-review runtime
        env:
          DEVX_EVOLVE_DEPLOY_KEY: ${{ secrets.DEVX_EVOLVE_DEPLOY_KEY }}
          DEVX_EVOLVE_REF: f49cb9c40d5e998bd979d235ac7b31d4a65cd658
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh-devx"
          printf '%s\n' "$DEVX_EVOLVE_DEPLOY_KEY" > "$HOME/.ssh-devx/id_ed25519"
          chmod 600 "$HOME/.ssh-devx/id_ed25519"
          cleanup() { rm -f "$HOME/.ssh-devx/id_ed25519"; }
          trap cleanup EXIT
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh-devx/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:sadmane_adobe/devx-evolve.git "$RUNNER_TEMP/devx-evolve"
          git -C "$RUNNER_TEMP/devx-evolve" fetch --depth 1 origin "$DEVX_EVOLVE_REF"
          git -C "$RUNNER_TEMP/devx-evolve" checkout FETCH_HEAD
          make -C "$RUNNER_TEMP/devx-evolve" code-review

      - name: Install review-quorum runtime
        run: |
          set -euo pipefail
          cd .review-quorum
          make install

      - name: Run aggregated review
        env:
          GH_TOKEN: ${{ github.token }}
          DEVX_REVIEWS_DIR: ${{ runner.temp }}/pr_reviews
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_URL: ${{ steps.pr.outputs.url }}
          DEVX_REPO_PATH: ${{ github.workspace }}
          DEVX_REQUIRE_AGENTS: "1"
        run: |
          set -uo pipefail
          export PATH="$HOME/.agentic-devx/bin:$PATH"
          devx-review-all "$PR_URL"

      - name: Post aggregated review
        if: always() && steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        env:
          DEVX_REVIEWS_DIR: ${{ runner.temp }}/pr_reviews
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const fs = require('fs');
            const n = process.env.PR_NUMBER;
            const path = `${process.env.DEVX_REVIEWS_DIR}/pr${n}/pr${n}_aggregated_review.md`;
            let body;
            try { body = fs.readFileSync(path, 'utf8'); }
            catch (e) { body = '⚠️ review-quorum produced no aggregated report — check the Actions run logs.'; }
            const MAX = 60000;
            if (body.length > MAX) body = body.slice(0, MAX) + '\n\n…_(truncated)_';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(n),
              body: `### 🔍 review-quorum\n\n${body}`,
            });
